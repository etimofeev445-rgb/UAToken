<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAT Cards</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #111111;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 500px;
    }

    .card {
        display: block;
        text-decoration: none;
        background: #1f1f1f;
        border-radius: 20px;
        padding: 25px;
        margin-bottom: 16px;
        text-align: center;
        color: white;
        font-size: 22px;
        font-weight: bold;
        border: 1px solid #333;
    }

    .card:active {
        transform: scale(0.98);
    }
</style>
</head>

<body>

<div class="container">

    <a class="card" href="#">
        💳 KRAK
    </a>

    <a class="card" href="#">
        💳 SIMPLE
    </a>

    <a class="card" href="#">
        💳 KOLO
    </a>

    <a class="card" href="#">
        💳 BITGET
    </a>

</div>

</body>
</html>
