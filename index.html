<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UAT App</title>

  <!-- Подключение Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--tg-theme-bg-color, #0b0b0f);
      color: var(--tg-theme-text-color, #fff);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      padding-bottom: 40px;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .header {
      text-align: center;
      padding: 20px 16px 12px;
      position: relative;
    }

    .clock {
      position: absolute;
      left: 16px;
      top: 22px;
      font-size: 14px;
      font-weight: 600;
      color: #00e676;
      font-variant-numeric: tabular-nums;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
    }

    .header p {
      color: #8b8b9e;
      font-size: 12px;
      margin-top: 2px;
    }

    .nav {
      display: flex;
      gap: 6px;
      padding: 0 16px 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    .nav-btn {
      flex: 1;
      padding: 10px 4px;
      border-radius: 12px;
      border: 1px solid #2a2a35;
      background: #121218;
      color: #8b8b9e;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-btn.active {
      background: #1f1f2a;
      color: #fff;
      border-color: #00e676;
    }

    .page {
      display: none;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .page.active {
      display: block;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-calendar { background: linear-gradient(135deg, #00b894, #55efc4); color: #003d2e; }
    .btn-calc { background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; }

    .rates-box, .converter, .cal-box, .calc-box {
      background: #121218;
      border: 1px solid #2a2a35;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .rates-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 12px;
      color: #8b8b9e;
    }

    .rate-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #1f1f28;
      font-size: 14px;
    }

    .rate-row:last-child { border-bottom: none; }
    .rate-code { font-weight: 700; }
    .rate-value { color: #00e676; font-weight: 600; }

    .converter h3 { font-size: 14px; margin-bottom: 10px; }
    .conv-row { display: flex; gap: 8px; margin-bottom: 8px; }

    .conv-row input, .conv-row select {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #2a2a35;
      background: #0f0f14;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .conv-result {
      padding: 10px;
      border-radius: 10px;
      background: #0f0f14;
      font-size: 15px;
      font-weight: 600;
      color: #00e676;
      text-align: center;
    }

    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .cal-header button {
      background: #1a1a22; border: 1px solid #2a2a35; border-radius: 8px;
      color: #fff; width: 32px; height: 32px; font-size: 16px; cursor: pointer;
    }
    .cal-title { font-size: 15px; font-weight: 600; }
    .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: #8b8b9e; margin-bottom: 6px; }
    .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 13px; }
    .cal-day.other { color: #3a3a45; }
    .cal-day.today { background: #00e676; color: #0b0b0f; font-weight: 700; }

    .calc-display {
      background: #0f0f14; border-radius: 10px; padding: 14px; text-align: right;
      font-size: 24px; font-weight: 600; min-height: 50px; word-break: break-all;
      margin-bottom: 10px; color: #00e676;
    }
    .calc-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .calc-btn {
      padding: 14px 0; border-radius: 10px; border: none; font-size: 16px;
      font-weight: 600; cursor: pointer; background: #1a1a22; color: #fff;
    }
    .calc-btn.op { background: #2a2a35; color: #00e676; }
    .calc-btn.eq { background: #00e676; color: #0b0b0f; }
    .calc-btn.clear { background: #e17055; color: #fff; }
    .calc-btn.zero { grid-column: span 2; }
  </style>
</head>

<body>

  <div class="header">
    <div class="clock" id="clock">--:--:--</div>
    <h1>UAT App</h1>
    <p>Курс НБУ · Календар · Калькулятор</p>
  </div>

  <div class="nav" id="main-nav">
    <div class="nav-btn active" data-page="home">🏠 Головна</div>
    <div class="nav-btn" data-page="calendar">📅 Календар</div>
    <div class="nav-btn" data-page="calc">🧮 Калькулятор</div>
  </div>

  <!-- ГОЛОВНА -->
  <div class="page active" id="page-home">
    <div class="buttons">
      <button class="btn btn-calendar" id="btn-go-calendar" type="button">📅 Календар</button>
      <button class="btn btn-calc" id="btn-go-calc" type="button">🧮 Калькулятор</button>
    </div>

    <div class="rates-box">
      <div class="rates-header">
        <span>Курс НБУ</span>
        <span id="rates-updated">оновлення...</span>
      </div>
      <div id="rates-list">Завантаження...</div>
    </div>

    <div class="converter">
      <h3>Конвертер</h3>
      <div class="conv-row">
        <input type="number" id="conv-amount" value="100" min="0" step="any" inputmode="decimal">
        <select id="conv-from">
          <option value="UAH">UAH</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="PLN">PLN</option>
          <option value="GBP">GBP</option>
        </select>
      </div>
      <div class="conv-row">
        <select id="conv-to">
          <option value="USD">USD</option>
          <option value="UAH" selected>UAH</option>
          <option value="EUR">EUR</option>
          <option value="PLN">PLN</option>
          <option value="GBP">GBP</option>
        </select>
      </div>
      <div class="conv-result" id="conv-result">—</div>
    </div>
  </div>

  <!-- КАЛЕНДАР -->
  <div class="page" id="page-calendar">
    <div class="cal-box">
      <div class="cal-header">
        <button id="cal-prev" type="button">‹</button>
        <div class="cal-title" id="cal-title">—</div>
        <button id="cal-next" type="button">›</button>
      </div>
      <div class="cal-weekdays">
        <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Нд</div>
      </div>
      <div class="cal-days" id="cal-days"></div>
    </div>
  </div>

  <!-- КАЛЬКУЛЯТОР -->
  <div class="page" id="page-calc">
    <div class="calc-box">
      <div class="calc-display" id="calc-display">0</div>
      <div class="calc-buttons" id="calc-buttons">
        <button class="calc-btn clear" data-action="clear">C</button>
        <button class="calc-btn op" data-val="/">÷</button>
        <button class="calc-btn op" data-val="*">×</button>
        <button class="calc-btn op" data-val="-">−</button>
        <button class="calc-btn" data-val="7">7</button>
        <button class="calc-btn" data-val="8">8</button>
        <button class="calc-btn" data-val="9">9</button>
        <button class="calc-btn op" data-val="+">+</button>
        <button class="calc-btn" data-val="4">4</button>
        <button class="calc-btn" data-val="5">5</button>
        <button class="calc-btn" data-val="6">6</button>
        <button class="calc-btn eq" data-action="equals" style="grid-row: span 2">=</button>
        <button class="calc-btn" data-val="1">1</button>
        <button class="calc-btn" data-val="2">2</button>
        <button class="calc-btn" data-val="3">3</button>
        <button class="calc-btn zero" data-val="0">0</button>
        <button class="calc-btn" data-val=".">.</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {

      // ИНИЦИАЛИЗАЦИЯ TELEGRAM WEBAPP
      var tg = window.Telegram ? window.Telegram.WebApp : null;
      if (tg) {
        tg.ready();
        tg.expand();
      }

      // 1. ЧАСЫ
      function updateClock() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, '0');
        var m = String(now.getMinutes()).padStart(2, '0');
        var s = String(now.getSeconds()).padStart(2, '0');
        var el = document.getElementById('clock');
        if (el) el.textContent = h + ':' + m + ':' + s;
      }
      setInterval(updateClock, 1000);
      updateClock();

      // 2. НАВИГАЦИЯ
      var navBtns = document.querySelectorAll('.nav-btn');
      var pages = document.querySelectorAll('.page');

      function switchPage(pageId) {
        navBtns.forEach(function(btn) {
          if (btn.getAttribute('data-page') === pageId) btn.classList.add('active');
          else btn.classList.remove('active');
        });
        pages.forEach(function(page) {
          if (page.id === 'page-' + pageId) page.classList.add('active');
          else page.classList.remove('active');
        });
      }

      navBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          switchPage(this.getAttribute('data-page'));
        });
      });

      document.getElementById('btn-go-calendar').addEventListener('click', function() { switchPage('calendar'); });
      document.getElementById('btn-go-calc').addEventListener('click', function() { switchPage('calc'); });

      // 3. КУРСЫ ВАЛЮТ
      var nbuRates = { UAH: 1, USD: 41.5, EUR: 45.2, PLN: 10.5, GBP: 53.0 };

      function calculateConversion() {
        var amount = parseFloat(document.getElementById('conv-amount').value) || 0;
        var from = document.getElementById('conv-from').value;
        var to = document.getElementById('conv-to').value;
        var res = (amount * (nbuRates[from] || 1)) / (nbuRates[to] || 1);
        document.getElementById('conv-result').textContent = res.toFixed(2) + ' ' + to;
      }

      function renderRates() {
        var list = document.getElementById('rates-list');
        list.innerHTML = '';
        ['USD', 'EUR', 'PLN', 'GBP'].forEach(function(code) {
          if (nbuRates[code]) {
            var row = document.createElement('div');
            row.className = 'rate-row';
            row.innerHTML = '<span class="rate-code">' + code + '</span><span class="rate-value">' + nbuRates[code].toFixed(2) + ' ₴</span>';
            list.appendChild(row);
          }
        });
        calculateConversion();
      }

      fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          data.forEach(function(item) { nbuRates[item.cc] = item.rate; });
          renderRates();
          document.getElementById('rates-updated').textContent = new Date().toLocaleDateString('uk-UA');
        })
        .catch(function() {
          renderRates();
          document.getElementById('rates-updated').textContent = 'резервний';
        });

      document.getElementById('conv-amount').addEventListener('input', calculateConversion);
      document.getElementById('conv-from').addEventListener('change', calculateConversion);
      document.getElementById('conv-to').addEventListener('change', calculateConversion);

      // 4. КАЛЕНДАРЬ
      var calDate = new Date();
      function renderCalendar() {
        var title = document.getElementById('cal-title');
        var days = document.getElementById('cal-days');
        var year = calDate.getFullYear();
        var month = calDate.getMonth();
        var monthNames = ['Січень', 'Лютий', 'Березень', 'Квітень', 'Травень', 'Червень', 'Липень', 'Серпень', 'Вересень', 'Жовтень', 'Листопад', 'Грудень'];

        title.textContent = monthNames[month] + ' ' + year;
        days.innerHTML = '';

        var firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
        var lastDay = new Date(year, month + 1, 0).getDate();
        var prevLast = new Date(year, month, 0).getDate();
        var now = new Date();

        for (var x = firstDay; x > 0; x--) {
          var d = document.createElement('div');
          d.className = 'cal-day other';
          d.textContent = prevLast - x + 1;
          days.appendChild(d);
        }

        for (var i = 1; i <= lastDay; i++) {
          var d = document.createElement('div');
          d.className = 'cal-day';
          if (i === now.getDate() && month === now.getMonth() && year === now.getFullYear()) d.classList.add('today');
          d.textContent = i;
          days.appendChild(d);
        }
      }

      document.getElementById('cal-prev').addEventListener('click', function() { calDate.setMonth(calDate.getMonth() - 1); renderCalendar(); });
      document.getElementById('cal-next').addEventListener('click', function() { calDate.setMonth(calDate.getMonth() + 1); renderCalendar(); });
      renderCalendar();

      // 5. КАЛЬКУЛЯТОР
      var calcDisplay = document.getElementById('calc-display');
      var calcExpr = '';

      document.getElementById('calc-buttons').addEventListener('click', function(e) {
        var btn = e.target.closest('.calc-btn');
        if (!btn) return;
        var action = btn.getAttribute('data-action');
        var val = btn.getAttribute('data-val');

        if (action === 'clear') {
          calcExpr = '';
          calcDisplay.textContent = '0';
        } else if (action === 'equals') {
          try {
            var res = Function('return (' + calcExpr.replace(/[^0-9+\-*/.]/g, '') + ')')();
            calcDisplay.textContent = res;
            calcExpr = String(res);
          } catch(err) {
            calcDisplay.textContent = 'Помилка';
            calcExpr = '';
          }
        } else if (val) {
          calcExpr += val;
          calcDisplay.textContent = calcExpr;
        }
      });

    });
  </script>
</body>
</html>
